name: "📝 Anmeldung"
description: Melde dich für das Klassen-Repository der FST AUD 25 an.
title: "Anmeldung: "
labels: ["anmeldung"]
body:
  - type: markdown
    attributes:
      value: |
        Schön, dass du dabei bist! 👋
        Nach dem Absenden lädt dich der Admin als Collaborator in dieses Repository ein – die Einladung kommt per E-Mail.

        **Achtung:** Dieses Repository ist öffentlich. Gib nur deinen Vornamen und den Anfangsbuchstaben deines Nachnamens an.
  - type: input
    id: name
    attributes:
      label: Name (Vorname + Anfangsbuchstabe des Nachnamens)
      placeholder: "z. B. Max M."
    validations:
      required: true
  - type: dropdown
    id: erfahrung
    attributes:
      label: Hast du schon mit Git oder GitHub gearbeitet?
      options:
        - Nein, noch nie
        - Ein bisschen
        - Ja, regelmäßig
    validations:
      required: true
  - type: checkboxes
    id: regeln
    attributes:
      label: Teamregeln
      options:
        - label: Ich habe die [Teamregeln](https://github.com/Yourworstdream/FSTAUD25/blob/main/CONTRIBUTING.md) gelesen und halte mich daran.
          required: true
